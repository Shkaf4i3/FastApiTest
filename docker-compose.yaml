services:
  app:
    env_file:
        - .env
    image: app
    build:
      dockerfile: ./Dockerfile
      context: ./
    environment:
      dsn: postgresql+asyncpg://postgres:5565@pg/postgres
      rabbitmq_url: amqp://local:local@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy
  pg:
    image: postgres:latest
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5565
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 10s
      timeout: 5s
      retries: 5
